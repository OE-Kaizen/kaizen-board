<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thank You!</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        
        .card {
            background: white;
            padding: 60px 40px;
            border-radius: 20px;
            text-align: center;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            max-width: 500px;
            animation: slideIn 0.5s ease;
        }
        
        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        .emoji {
            font-size: 80px;
            margin-bottom: 20px;
            animation: bounce 0.6s ease;
        }
        
        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-20px); }
        }
        
        h1 {
            font-size: 48px;
            color: #27ae60;
            margin-bottom: 15px;
        }
        
        p {
            font-size: 18px;
            color: #666;
            margin-bottom: 10px;
        }
        
        .project-title {
            font-size: 24px;
            color: #667eea;
            font-weight: bold;
            margin: 25px 0;
        }
        
        .likes-display {
            font-size: 48px;
            color: #e74c3c;
            font-weight: bold;
            margin: 20px 0;
        }
        
        .timer {
            color: #999;
            font-size: 14px;
            margin-top: 30px;
            padding-top: 20px;
            border-top: 2px solid #eee;
        }
        
        .back-link {
            color: #667eea;
            text-decoration: none;
            font-weight: bold;
            margin-top: 20px;
            display: inline-block;
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="emoji">✅</div>
        <h1>Thank You!</h1>
        <p>Your vote has been counted</p>
        
        <div class="project-title" id="projectTitle">Loading...</div>
        <div class="likes-display">❤️ <span id="likeCount">0</span> likes</div>
        
        <p class="timer">Redirecting in 3 seconds...</p>
        <a href="index.html" class="back-link">← Back to Board</a>
    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const projectId = urlParams.get('id');

        const projects = {
            "KZ-001": "Reduce Process Time",
            "KZ-002": "Cost Reduction",
            "KZ-003": "Waste Elimination",
            "KZ-004": "Quality Improvement",
            "KZ-005": "Safety Enhancement"
        };

        if (projectId && projects[projectId]) {
            let likes = parseInt(localStorage.getItem(`likes_${projectId}`)) || 0;
            likes++;
            localStorage.setItem(`likes_${projectId}`, likes);

            document.getElementById('projectTitle').textContent = projects[projectId];
            document.getElementById('likeCount').textContent = likes;

            setTimeout(() => {
                window.location.href = 'index.html';
            }, 3000);
        } else {
            document.querySelector('.card').innerHTML = '<h1>❌ Invalid Project</h1><p>Could not find project.</p>';
        }
    </script>
</body>
</html>
