<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Kaizen Like</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: "Segoe UI", Arial, sans-serif;
      background: #f0f0f0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    /* ── Outer card with blue/orange gradient border ── */
    .card-wrapper {
      background: linear-gradient(135deg, #0033AA, #FF6600);
      border-radius: 20px;
      padding: 5px;
      max-width: 380px;
      width: 100%;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.18);
    }

    .card {
      background: #ffffff;
      border-radius: 16px;
      padding: 48px 32px 40px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0;
      text-align: center;
    }

    /* ── Heart ── */
    .heart {
      font-size: 80px;
      line-height: 1;
      margin-bottom: 28px;
      animation: heartBeat 0.7s ease;
    }
    @keyframes heartBeat {
      0%   { transform: scale(0.5); opacity: 0; }
      60%  { transform: scale(1.15); }
      100% { transform: scale(1);   opacity: 1; }
    }

    /* ── Main message ── */
    .message {
      font-size: 20px;
      font-weight: 400;
      color: #222222;
      line-height: 1.5;
      margin-bottom: 20px;
    }
    .message strong {
      font-weight: 700;
    }

    /* ── Thank you line ── */
    .thankyou {
      font-size: 20px;
      font-weight: 400;
      color: #222222;
      line-height: 1.5;
    }

    /* ── Loading / Error states ── */
    .spinner {
      width: 50px; height: 50px;
      border: 4px solid #E0E8F8;
      border-top-color: #0033AA;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin-bottom: 20px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    .loading-text {
      font-size: 16px;
      color: #555;
    }

    .error-icon  { font-size: 56px; margin-bottom: 16px; }
    .error-title { font-size: 20px; font-weight: 700; color: #CC0000; margin-bottom: 10px; }
    .error-msg   { font-size: 15px; color: #555; }

    /* ── State visibility ── */
    .state        { display: none; flex-direction: column; align-items: center; }
    .state.active { display: flex; }
  </style>
</head>
<body>

<div class="card-wrapper">
  <div class="card">

    <!-- LOADING -->
    <div class="state active" id="stateLoading">
      <div class="spinner"></div>
      <p class="loading-text">Recording your like…</p>
    </div>

    <!-- SUCCESS -->
    <div class="state" id="stateSuccess">
      <div class="heart">❤️</div>
      <p class="message">Your support to <strong id="projectLabel">this project</strong> has been recorded.</p>
      <p class="thankyou">Thank you for participating!</p>
    </div>

    <!-- ERROR -->
    <div class="state" id="stateError">
      <div class="error-icon">⚠️</div>
      <div class="error-title">Something went wrong</div>
      <p class="error-msg" id="errorMsg">Could not record your like. Please try again.</p>
    </div>

  </div>
</div>

<script>
// ── CONFIG — replace with your new personal Google account Apps Script URL ──
// const APPS_SCRIPT_URL = "PASTE_YOUR_NEW_APPS_SCRIPT_URL_HERE";

const TAG_LABELS = {
  p1: "P1",
  p2: "P2",
  p3: "P3",
  p4: "P4",
  p5: "P5"
};

function showState(id) {
  ["stateLoading", "stateSuccess", "stateError"].forEach(s =>
    document.getElementById(s).classList.remove("active")
  );
  document.getElementById(id).classList.add("active");
}

function getParam(name) {
  return new URLSearchParams(window.location.search).get(name) || "";
}

function isRecentTap(tagId) {
  const key  = `lastTap_${tagId}`;
  const last = parseInt(localStorage.getItem(key) || "0", 10);
  const now  = Date.now();
  if (now - last < 30000) return true;
  localStorage.setItem(key, now);
  return false;
}

(async function main() {
  const tagId = getParam("id").toLowerCase();

  if (!tagId) {
    document.getElementById("errorMsg").textContent =
      "No project ID found in the URL. Please scan the correct NFC tag.";
    showState("stateError");
    return;
  }

  const label = TAG_LABELS[tagId] || tagId.toUpperCase();
  document.getElementById("projectLabel").textContent = label;

  if (isRecentTap(tagId)) {
    showState("stateSuccess");
    return;
  }

  try {
    const res  = await fetch(
      `${APPS_SCRIPT_URL}?action=like&id=${encodeURIComponent(tagId)}`,
      { cache: "no-store" }
    );
    const data = await res.json();

    if (data.status !== "ok") throw new Error(data.message || "Script error");

    showState("stateSuccess");

  } catch (err) {
    console.error(err);
    document.getElementById("errorMsg").textContent =
      `Could not record your like: ${err.message}`;
    showState("stateError");
  }
})();
</script>

</body>
</html>
