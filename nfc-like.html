<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thank You!</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        
        .card {
            background: white;
            padding: 60px 40px;
            border-radius: 20px;
            text-align: center;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            max-width: 500px;
            animation: slideIn 0.5s ease;
        }
        
        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        .emoji {
            font-size: 80px;
            margin-bottom: 20px;
            animation: bounce 0.6s ease;
        }
        
        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-20px); }
        }
        
        h1 {
            font-size: 48px;
            color: #27ae60;
            margin-bottom: 15px;
        }
        
        p {
            font-size: 18px;
            color: #666;
            margin-bottom: 10px;
        }
        
        .project-title {
            font-size: 24px;
            color: #667eea;
            font-weight: bold;
            margin: 25px 0;
        }
        
        .likes-display {
            font-size: 48px;
            color: #e74c3c;
            font-weight: bold;
            margin: 20px 0;
        }
        
        .timer {
            color: #999;
            font-size: 14px;
            margin-top: 30px;
            padding-top: 20px;
            border-top: 2px solid #eee;
        }
        
        .back-link {
            color: #667eea;
            text-decoration: none;
            font-weight: bold;
            margin-top: 20px;
            display: inline-block;
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="emoji">✅</div>
        <h1>Thank You!</h1>
        <p>Your vote has been counted</p>
        
        <div class="project-title" id="projectTitle">Loading...</div>
        <div class="likes-display">❤️ <span id="likeCount">0</span> likes</div>
        
        <p class="timer">Redirecting in 3 seconds...</p>
        <a href="index.html" class="back-link">← Back to Board</a>
    </div>

    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-database.js"></script>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyAkpJS33MYZiioWbi9Nmv1qYwAq_DHH4gI",
            authDomain: "kaizen-board-b5144.firebaseapp.com",
            databaseURL: "https://kaizen-board-b5144-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "kaizen-board-b5144",
            storageBucket: "kaizen-board-b5144.firebasestorage.app",
            messagingSenderId: "737336450726",
            appId: "1:737336450726:web:69e27d3944bdf51dd29e67",
            measurementId: "G-VJF9PQHEVK"
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        const projects = {
            "KZ-001": "Reduce Process Time",
            "KZ-002": "Cost Reduction",
            "KZ-003": "Waste Elimination",
            "KZ-004": "Quality Improvement",
            "KZ-005": "Safety Enhancement"
        };

        async function processTap() {
            const urlParams = new URLSearchParams(window.location.search);
            const projectId = urlParams.get('id');

            if (projectId && projects[projectId]) {
                try {
                    const snapshot = await db.ref(`likes/${projectId}`).get();
                    let currentLikes = snapshot.val() || 0;
                    currentLikes++;
                    
                    await db.ref(`likes/${projectId}`).set(currentLikes);
                    
                    document.getElementById('projectTitle').textContent = projects[projectId];
                    document.getElementById('likeCount').textContent = currentLikes;

                    setTimeout(() => {
                        window.location.href = 'index.html';
                    }, 3000);
                } catch (error) {
                    console.error('Error:', error);
                    document.getElementById('projectTitle').textContent = 'Error updating';
                }
            } else {
                document.querySelector('.card').innerHTML = '<h1>❌ Invalid Project</h1>';
            }
        }

        window.addEventListener('DOMContentLoaded', processTap);
    </script>
</body>
</html>
