<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Kaizen Like</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: "Segoe UI", Arial, sans-serif;
      background: #f0f0f0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .card-wrapper {
      background: linear-gradient(135deg, #0033AA, #FF6600);
      border-radius: 20px;
      padding: 5px;
      max-width: 380px;
      width: 100%;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.18);
    }

    .card {
      background: #ffffff;
      border-radius: 16px;
      padding: 48px 32px 40px;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
    }

    .heart {
      font-size: 80px;
      line-height: 1;
      margin-bottom: 28px;
      animation: heartBeat 0.7s ease;
    }
    @keyframes heartBeat {
      0%   { transform: scale(0.5); opacity: 0; }
      60%  { transform: scale(1.15); }
      100% { transform: scale(1);   opacity: 1; }
    }

    .message {
      font-size: 20px;
      font-weight: 400;
      color: #222222;
      line-height: 1.5;
      margin-bottom: 20px;
    }
    .message strong {
      font-weight: 700;
    }

    .thankyou {
      font-size: 20px;
      font-weight: 400;
      color: #222222;
      line-height: 1.5;
    }
  </style>
</head>
<body>

<div class="card-wrapper">
  <div class="card">
    <div class="heart">❤️</div>
    <p class="message">Your support to <strong id="projectLabel"></strong> has been recorded.</p>
    <p class="thankyou">Thank you for participating!</p>
  </div>
</div>

<script>
const TAG_LABELS = {
  p1: "P1",
  p2: "P2",
  p3: "P3",
  p4: "P4",
  p5: "P5"
};

const tagId = new URLSearchParams(window.location.search).get("id") || "";
const label = TAG_LABELS[tagId.toLowerCase()] || tagId.toUpperCase();
document.getElementById("projectLabel").textContent = label;
</script>

</body>
</html>
