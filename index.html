<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Kaizen Communication Board</title>
  <style>
    /* ── Roche Brand Colours ─────────────────────────────────── */
    :root {
      --roche-blue:   #0066CC;
      --roche-dark:   #003366;
      --roche-light:  #E6F0FA;
      --roche-accent: #FF6600;
      --card-bg:      #FFFFFF;
      --text-dark:    #1A1A2E;
      --text-mid:     #4A4A6A;
      --border:       #D0DFF0;
      --gold:         #FFD700;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: "Segoe UI", Arial, sans-serif;
      background: linear-gradient(135deg, var(--roche-dark) 0%, var(--roche-blue) 100%);
      min-height: 100vh;
      padding: 24px 16px 40px;
    }

    /* ── Header ─────────────────────────────────────────────── */
    header {
      text-align: center;
      margin-bottom: 32px;
    }
    .roche-logo {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 12px;
    }
    .roche-hexagon {
      width: 44px; height: 44px;
      background: #FFFFFF;
      clip-path: polygon(50% 0%,100% 25%,100% 75%,50% 100%,0% 75%,0% 25%);
      display: flex; align-items: center; justify-content: center;
    }
    .roche-hexagon span {
      font-size: 18px; font-weight: 900; color: var(--roche-blue);
    }
    .logo-text {
      font-size: 28px; font-weight: 700; color: #FFFFFF;
      letter-spacing: 2px;
    }
    header h1 {
      font-size: clamp(22px, 4vw, 38px);
      color: #FFFFFF;
      font-weight: 300;
      letter-spacing: 1px;
    }
    header p.subtitle {
      color: rgba(255,255,255,0.75);
      font-size: 15px;
      margin-top: 6px;
    }
    .quarter-badge {
      display: inline-block;
      background: var(--roche-accent);
      color: #fff;
      font-size: 13px;
      font-weight: 600;
      padding: 4px 14px;
      border-radius: 20px;
      margin-top: 10px;
      letter-spacing: 1px;
    }

    /* ── Status bar ─────────────────────────────────────────── */
    .status-bar {
      text-align: center;
      color: rgba(255,255,255,0.6);
      font-size: 12px;
      margin-bottom: 20px;
      min-height: 18px;
    }
    .status-bar.error { color: #FF8888; }

    /* ── Cards grid ─────────────────────────────────────────── */
    .cards-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      gap: 24px;
      max-width: 1200px;
      margin: 0 auto;
    }

    /* ── Project Card ───────────────────────────────────────── */
    .card {
      background: var(--card-bg);
      border-radius: 16px;
      padding: 28px 24px 24px;
      box-shadow: 0 8px 32px rgba(0,0,0,0.18);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
      transition: transform 0.2s, box-shadow 0.2s;
      position: relative;
      overflow: hidden;
    }
    .card::before {
      content: "";
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 5px;
      background: linear-gradient(90deg, var(--roche-blue), var(--roche-accent));
    }
    .card:hover {
      transform: translateY(-4px);
      box-shadow: 0 14px 40px rgba(0,0,0,0.22);
    }

    .card-number {
      width: 36px; height: 36px;
      background: var(--roche-light);
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 15px; font-weight: 700; color: var(--roche-blue);
      position: absolute;
      top: 16px; left: 16px;
    }

    .card-icon {
      font-size: 40px;
      line-height: 1;
    }

    .card-title {
      font-size: 17px;
      font-weight: 700;
      color: var(--text-dark);
      text-align: center;
      line-height: 1.3;
    }

    .card-quarter {
      font-size: 12px;
      color: var(--text-mid);
      background: var(--roche-light);
      padding: 3px 12px;
      border-radius: 12px;
    }

    /* ── Like Counter ───────────────────────────────────────── */
    .like-section {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      margin-top: 4px;
    }
    .like-count {
      font-size: 52px;
      font-weight: 900;
      color: var(--roche-blue);
      line-height: 1;
      min-width: 80px;
      text-align: center;
      transition: transform 0.3s;
    }
    .like-count.bump {
      transform: scale(1.25);
    }
    .like-label {
      font-size: 13px;
      color: var(--text-mid);
      letter-spacing: 0.5px;
    }

    .heart-row {
      display: flex;
      gap: 4px;
      flex-wrap: wrap;
      justify-content: center;
      max-width: 200px;
    }
    .heart {
      font-size: 18px;
      animation: popIn 0.4s ease;
    }
    @keyframes popIn {
      0%   { transform: scale(0); opacity: 0; }
      60%  { transform: scale(1.3); }
      100% { transform: scale(1); opacity: 1; }
    }

    /* ── NFC hint ───────────────────────────────────────────── */
    .nfc-hint {
      font-size: 12px;
      color: var(--roche-blue);
      background: var(--roche-light);
      border-radius: 8px;
      padding: 6px 12px;
      display: flex;
      align-items: center;
      gap: 6px;
      width: 100%;
      justify-content: center;
    }

    /* ── Footer ─────────────────────────────────────────────── */
    footer {
      text-align: center;
      margin-top: 36px;
      color: rgba(255,255,255,0.5);
      font-size: 12px;
    }

    /* ── Loading skeleton ───────────────────────────────────── */
    .skeleton .like-count {
      background: #E0E0E0;
      color: transparent;
      border-radius: 8px;
      animation: pulse 1.2s infinite;
    }
    @keyframes pulse {
      0%,100% { opacity: 1; }
      50%      { opacity: 0.4; }
    }
  </style>
</head>
<body>

<header>

  <h1>Kaizen Communication Board</h1>
  <p class="subtitle">Tap an NFC tag to show your support for a project!</p>
  <div class="quarter-badge" id="quarterBadge">Q1-2026</div>
</header>

<div class="status-bar" id="statusBar">Loading projects…</div>

<div class="cards-grid" id="cardsGrid">
  <!-- Cards injected by JS -->
</div>

<footer>
  <p>🔄 Live data · refreshes every 10 seconds &nbsp;|&nbsp; Roche RSTO Operational Excellence</p>
</footer>

<script>
// ── CONFIG ────────────────────────────────────────────────────────
const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwGUsSvrCDG8dNZBhLGz5T8xFpzU63YmZXGPrZNXDSZfJcxa24Vd5f2vXM6oat0ipLU5Q/exec";
const REFRESH_INTERVAL_MS = 10000;   // 10 seconds

// Project icons mapped by tag ID (customise freely)
const ICONS = {
  p1: "📦",   // Automated Inventory Tracking
  p2: "📬",   // Redesigned Packaging Station
  p3: "🔧",   // Ergonomic Assembly Line
  p4: "📋",   // Digital Kanban Board
  p5: "🦺",   // Safe Walkways Initiative
};

// ── STATE ─────────────────────────────────────────────────────────
let previousCounts = {};

// ── FETCH & RENDER ────────────────────────────────────────────────
async function fetchAndRender() {
  const statusBar = document.getElementById("statusBar");
  try {
    const res  = await fetch(`${APPS_SCRIPT_URL}?action=counts`, { cache: "no-store" });
    const data = await res.json();

    if (data.status !== "ok") throw new Error(data.message || "Unknown error");

    renderCards(data.projects);
    const now = new Date().toLocaleTimeString();
    statusBar.textContent = `✅ Last updated: ${now}`;
    statusBar.className = "status-bar";
  } catch (err) {
    console.error(err);
    statusBar.textContent = `⚠️ Could not reach server — retrying… (${err.message})`;
    statusBar.className = "status-bar error";
  }
}

function renderCards(projects) {
  const grid = document.getElementById("cardsGrid");

  projects.forEach((proj, idx) => {
    const id    = proj.tagId;
    const count = proj.likes;
    const icon  = ICONS[id] || "⭐";

    // Update quarter badge from first project
    if (idx === 0) {
      document.getElementById("quarterBadge").textContent = proj.quarter;
    }

    let card = document.getElementById(`card-${id}`);

    if (!card) {
      // ── Create card ──────────────────────────────────────
      card = document.createElement("div");
      card.className = "card skeleton";
      card.id = `card-${id}`;
      card.innerHTML = `
        <div class="card-number">${idx + 1}</div>
        <div class="card-icon">${icon}</div>
        <div class="card-title">${proj.projectName}</div>
        <div class="card-quarter">${proj.quarter}</div>
        <div class="like-section">
          <div class="like-count" id="count-${id}">0</div>
          <div class="like-label">❤️ Likes</div>
          <div class="heart-row" id="hearts-${id}"></div>
        </div>
        <div class="nfc-hint">📱 Tap NFC tag to like this project</div>
      `;
      grid.appendChild(card);
    }

    // ── Update count ──────────────────────────────────────
    const countEl  = document.getElementById(`count-${id}`);
    const heartsEl = document.getElementById(`hearts-${id}`);
    const prev     = previousCounts[id] || 0;

    countEl.textContent = count;
    card.classList.remove("skeleton");

    // Animate bump if count increased
    if (count > prev) {
      countEl.classList.add("bump");
      setTimeout(() => countEl.classList.remove("bump"), 400);

      // Add new heart icons
      const newHearts = count - prev;
      for (let i = 0; i < newHearts; i++) {
        const h = document.createElement("span");
        h.className = "heart";
        h.textContent = "❤️";
        heartsEl.appendChild(h);
      }
    }

    // Keep only last 20 hearts visible
    while (heartsEl.children.length > 20) {
      heartsEl.removeChild(heartsEl.firstChild);
    }

    previousCounts[id] = count;
  });
}

// ── INIT ──────────────────────────────────────────────────────────
fetchAndRender();
setInterval(fetchAndRender, REFRESH_INTERVAL_MS);
</script>
</body>
</html>
