<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kaizen Recognition Board</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        
        header {
            text-align: center;
            color: white;
            margin-bottom: 40px;
            padding: 20px 0;
        }
        
        h1 {
            font-size: 48px;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.2);
        }
        
        .subtitle {
            font-size: 18px;
            opacity: 0.9;
        }
        
        .projects-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(350px, 1fr));
            gap: 20px;
            margin-bottom: 40px;
        }
        
        .project-card {
            background: white;
            border-radius: 12px;
            padding: 25px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.1);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }
        
        .project-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 12px 40px rgba(0,0,0,0.2);
        }
        
        .project-id {
            color: #667eea;
            font-size: 12px;
            font-weight: bold;
            text-transform: uppercase;
            margin-bottom: 8px;
        }
        
        .project-title {
            font-size: 24px;
            font-weight: bold;
            color: #333;
            margin-bottom: 12px;
        }
        
        .project-description {
            color: #666;
            font-size: 14px;
            margin-bottom: 20px;
            line-height: 1.5;
        }
        
        .likes-section {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-top: 15px;
            border-top: 2px solid #eee;
        }
        
        .likes-count {
            font-size: 28px;
            font-weight: bold;
            color: #e74c3c;
        }
        
        .like-btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            text-decoration: none;
            display: inline-block;
            transition: transform 0.2s ease;
        }
        
        .like-btn:hover {
            transform: scale(1.05);
        }
        
        .like-btn:active {
            transform: scale(0.95);
        }
        
        footer {
            text-align: center;
            color: white;
            padding: 20px;
            opacity: 0.8;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>🏆 Roche Kaizen Recognition Board</h1>
            <p class="subtitle">Celebrating Innovation & Continuous Improvement</p>
        </header>

        <div class="projects-grid" id="projectsGrid">
            <p style="color: white; text-align: center; grid-column: 1/-1;">Loading projects...</p>
        </div>

        <footer>
            <p>Last updated: <span id="lastUpdate"></span></p>
        </footer>
    </div>

    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-database.js"></script>

    <script>
        let db = null;
        let likes = {
            "KZ-001": 0,
            "KZ-002": 0,
            "KZ-003": 0,
            "KZ-004": 0,
            "KZ-005": 0
        };

        const projects = {
            "KZ-001": {
                title: "Reduce Process Time",
                description: "Streamline approval workflow to reduce turnaround time by 40%"
            },
            "KZ-002": {
                title: "Cost Reduction",
                description: "Optimize material sourcing and reduce procurement costs"
            },
            "KZ-003": {
                title: "Waste Elimination",
                description: "Cut packaging waste and improve sustainability practices"
            },
            "KZ-004": {
                title: "Quality Improvement",
                description: "Reduce defects in final testing phase by 50%"
            },
            "KZ-005": {
                title: "Safety Enhancement",
                description: "Improve lab safety procedures and incident prevention"
            }
        };

        function initFirebase() {
            if (typeof firebase === 'undefined') {
                console.log('Waiting for Firebase to load...');
                setTimeout(initFirebase, 100);
                return;
            }

            const firebaseConfig = {
                apiKey: "AIzaSyAkpJS33MYZiioWbi9Nmv1qYwAq_DHH4gI",
                authDomain: "kaizen-board-b5144.firebaseapp.com",
                databaseURL: "https://kaizen-board-b5144-default-rtdb.asia-southeast1.firebasedatabase.app",
                projectId: "kaizen-board-b5144",
                storageBucket: "kaizen-board-b5144.firebasestorage.app",
                messagingSenderId: "737336450726",
                appId: "1:737336450726:web:69e27d3944bdf51dd29e67",
                measurementId: "G-VJF9PQHEVK"
            };

            try {
                if (!firebase.apps.length) {
                    firebase.initializeApp(firebaseConfig);
                }
                db = firebase.database();
                console.log('Firebase initialized successfully');
                listenToLikes();
            } catch (error) {
                console.error('Firebase init error:', error);
                renderProjects();
            }
        }

        function listenToLikes() {
            try {
                db.ref('likes').on('value', (snapshot) => {
                    const data = snapshot.val();
                    console.log('Firebase data received:', data);
                    if (data) {
                        likes = data;
                    } else {
                        console.log('No data found, initializing...');
                        db.ref('likes').set(likes);
                    }
                    renderProjects();
                }, (error) => {
                    console.error('Firebase read error:', error);
                    renderProjects();
                });
            } catch (error) {
                console.error('Error listening to likes:', error);
                renderProjects();
            }
        }

        function renderProjects() {
            console.log('Rendering projects with likes:', likes);
            const grid = document.getElementById('projectsGrid');
            grid.innerHTML = '';

            for (let projectId in projects) {
                const project = projects[projectId];
                const likeCount = likes[projectId] || 0;

                const card = document.createElement('div');
                card.className = 'project-card';
                card.innerHTML = `
                    <div class="project-id">${projectId}</div>
                    <div class="project-title">${project.title}</div>
                    <div class="project-description">${project.description}</div>
                    <div class="likes-section">
                        <div class="likes-count">❤️ ${likeCount}</div>
                        <a href="nfc-like.html?id=${projectId}" class="like-btn">👍 Like</a>
                    </div>
                `;
                grid.appendChild(card);
            }

            document.getElementById('lastUpdate').textContent = new Date().toLocaleString();
        }

        // Wait for page to load, then init Firebase
        window.addEventListener('DOMContentLoaded', () => {
            console.log('Page loaded, initializing Firebase...');
            initFirebase();
        });
    </script>
</body>
</html>
