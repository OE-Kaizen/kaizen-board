<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kaizen Recognition Board</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        
        header {
            text-align: center;
            color: white;
            margin-bottom: 40px;
            padding: 20px 0;
        }
        
        h1 {
            font-size: 48px;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.2);
        }
        
        .subtitle {
            font-size: 18px;
            opacity: 0.9;
        }
        
        .projects-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(350px, 1fr));
            gap: 20px;
            margin-bottom: 40px;
        }
        
        .project-card {
            background: white;
            border-radius: 12px;
            padding: 25px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.1);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }
        
        .project-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 12px 40px rgba(0,0,0,0.2);
        }
        
        .project-id {
            color: #667eea;
            font-size: 12px;
            font-weight: bold;
            text-transform: uppercase;
            margin-bottom: 8px;
        }
        
        .project-title {
            font-size: 24px;
            font-weight: bold;
            color: #333;
            margin-bottom: 12px;
        }
        
        .project-description {
            color: #666;
            font-size: 14px;
            margin-bottom: 20px;
            line-height: 1.5;
        }
        
        .likes-section {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-top: 15px;
            border-top: 2px solid #eee;
        }
        
        .likes-count {
            font-size: 28px;
            font-weight: bold;
            color: #e74c3c;
        }
        
        .like-btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.2s ease;
        }
        
        .like-btn:hover {
            transform: scale(1.05);
        }
        
        .like-btn:active {
            transform: scale(0.95);
        }
        
        .success-message {
            color: #27ae60;
            font-size: 12px;
            margin-top: 8px;
            opacity: 0;
            transition: opacity 0.3s ease;
        }
        
        .success-message.show {
            opacity: 1;
        }
        
        footer {
            text-align: center;
            color: white;
            padding: 20px;
            opacity: 0.8;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>🏆 Roche Kaizen Recognition Board</h1>
            <p class="subtitle">Celebrating Innovation & Continuous Improvement</p>
        </header>

        <div class="projects-grid" id="projectsGrid">
            <!-- Projects will be loaded here by JavaScript -->
        </div>

        <footer>
            <p>Last updated: <span id="lastUpdate"></span></p>
        </footer>
    </div>

    <script>
        // Projects data - stored in browser's local storage
        const projects = {
            "KZ-001": {
                title: "Reduce Process Time",
                description: "Streamline approval workflow to reduce turnaround time by 40%",
                team: "Operations"
            },
            "KZ-002": {
                title: "Cost Reduction",
                description: "Optimize material sourcing and reduce procurement costs",
                team: "Supply Chain"
            },
            "KZ-003": {
                title: "Waste Elimination",
                description: "Cut packaging waste and improve sustainability practices",
                team: "Manufacturing"
            },
            "KZ-004": {
                title: "Quality Improvement",
                description: "Reduce defects in final testing phase by 50%",
                team: "QA"
            },
            "KZ-005": {
                title: "Safety Enhancement",
                description: "Improve lab safety procedures and incident prevention",
                team: "Safety"
            }
        };

        // Initialize localStorage for likes
        function initializeLikes() {
            for (let projectId in projects) {
                if (!localStorage.getItem(`likes_${projectId}`)) {
                    localStorage.setItem(`likes_${projectId}`, '0');
                }
            }
        }

        // Render all project cards
        function renderProjects() {
            const grid = document.getElementById('projectsGrid');
            grid.innerHTML = '';

            for (let projectId in projects) {
                const project = projects[projectId];
                const likes = localStorage.getItem(`likes_${projectId}`) || '0';

                const card = document.createElement('div');
                card.className = 'project-card';
                card.innerHTML = `
                    <div class="project-id">${projectId}</div>
                    <div class="project-title">${project.title}</div>
                    <div class="project-description">${project.description}</div>
                    <div class="likes-section">
                        <div class="likes-count">❤️ ${likes}</div>
                        <button class="like-btn" onclick="addLike('${projectId}')">👍 Like</button>
                    </div>
                    <div class="success-message" id="msg-${projectId}">✅ Thank you!</div>
                `;
                grid.appendChild(card);
            }

            document.getElementById('lastUpdate').textContent = new Date().toLocaleString();
        }

        // Add like and show confirmation
        function addLike(projectId) {
            let likes = parseInt(localStorage.getItem(`likes_${projectId}`)) || 0;
            likes++;
            localStorage.setItem(`likes_${projectId}`, likes);

            // Update the display
            renderProjects();

            // Show success message
            const msg = document.getElementById(`msg-${projectId}`);
            msg.classList.add('show');
            setTimeout(() => {
                msg.classList.remove('show');
            }, 2000);
        }

        // Initialize on page load
        window.addEventListener('DOMContentLoaded', () => {
            initializeLikes();
            renderProjects();
        });
    </script>
</body>
</html>
